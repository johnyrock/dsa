<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #faf9f6;
    --panel: #ffffff;
    --ink: #1f2328;
    --muted: #6b7280;
    --line: #e5e2db;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --ok: #16a34a;
    --ok-soft: #dcfce7;
    --warn: #d97706;
    --warn-soft: #fef3c7;
    --code-bg: #f3f1ec;
    --node-bg: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1c1f24;
      --ink: #e6e6e6;
      --muted: #9aa0a6;
      --line: #2c3037;
      --accent: #60a5fa;
      --accent-soft: #1e3a5f;
      --ok: #4ade80;
      --ok-soft: #14532d;
      --warn: #fbbf24;
      --warn-soft: #713f12;
      --code-bg: #23262d;
      --node-bg: #1c1f24;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  code { background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
  pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; overflow-x: auto; font-size: 0.88rem; line-height: 1.55;
  }
  pre code { background: none; padding: 0; font-size: inherit; }
  a { color: var(--accent); }

  header { max-width: 760px; margin: 0 auto; padding: 48px 24px 8px; }
  header .home { display: inline-block; margin-bottom: 18px; color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600; }
  header .home:hover { text-decoration: underline; }
  header .tag { color: var(--muted); font-size: 0.85rem; letter-spacing: 0.06em; text-transform: uppercase; }
  header h1 { margin: 6px 0 8px; font-size: 2.1rem; line-height: 1.15; }
  header p.lede { margin: 0; color: var(--muted); }

  main { max-width: 760px; margin: 0 auto; padding: 24px 24px 72px; }

  section { margin: 44px 0; }
  section h2 { font-size: 1.35rem; margin: 0 0 12px; }
  section h3 { font-size: 1.05rem; margin: 28px 0 10px; }
  section p { margin: 0 0 14px; }
  section ul, section ol { margin: 0 0 14px; padding-left: 22px; }
  section li { margin: 4px 0; }
  .muted { color: var(--muted); }

  .callout {
    border: 1px solid var(--line); background: var(--panel); border-radius: 10px;
    padding: 14px 18px; margin: 18px 0; font-size: 0.95rem;
  }
  .callout.why { border-left: 4px solid var(--accent); }
  .callout.gotcha { border-left: 4px solid var(--warn); }
  .callout.tip { border-left: 4px solid var(--ok); }

  /* --- array / cell diagrams --- */
  .cells-wrap { margin: 26px 0 8px; overflow-x: auto; padding: 22px 2px 26px; }
  .cells { display: flex; gap: 6px; font-family: ui-monospace, Menlo, monospace; font-size: 0.95rem; }
  .cell {
    position: relative; flex-shrink: 0; min-width: 46px; height: 46px; padding: 0 8px;
    border: 1.5px solid var(--ink); border-radius: 8px; background: var(--node-bg);
    display: flex; align-items: center; justify-content: center;
  }
  .cell .idx { position: absolute; top: -20px; left: 0; right: 0; text-align: center; font-size: 0.7rem; color: var(--muted); }
  .cell .ptr { position: absolute; bottom: -22px; left: 0; right: 0; text-align: center; font-size: 0.72rem; color: var(--accent); font-weight: 700; white-space: nowrap; }
  .cell.hi { border-color: var(--accent); background: var(--accent-soft); }
  .cell.ok { border-color: var(--ok); background: var(--ok-soft); }
  .cell.warn { border-color: var(--warn); background: var(--warn-soft); }
  .cell.dim { opacity: 0.4; }
  .caption { color: var(--muted); font-size: 0.9rem; margin: 0 0 18px; }

  /* --- node diagrams (linked lists, trees drawn inline) --- */
  .diagram {
    display: flex; align-items: center; flex-wrap: wrap; gap: 0;
    margin: 22px 0; overflow-x: auto; padding: 8px 2px 14px;
  }
  .node {
    display: flex; flex-shrink: 0; border: 1.5px solid var(--ink); border-radius: 8px;
    overflow: hidden; background: var(--node-bg); font-family: ui-monospace, Menlo, monospace;
    font-size: 0.95rem;
  }
  .node .val { padding: 10px 16px; border-right: 1.5px solid var(--ink); min-width: 2.2em; text-align: center; }
  .node .ptr { padding: 10px 12px; color: var(--muted); min-width: 2.4em; text-align: center; }
  .node.hi { border-color: var(--accent); }
  .node.hi .val { background: var(--accent-soft); }
  .node.null { flex-shrink: 0; font-family: ui-monospace, Menlo, monospace; color: var(--muted); padding: 10px 8px; font-size: 0.9rem; }
  .arrow { flex-shrink: 0; padding: 0 8px; color: var(--muted); font-size: 1.2rem; line-height: 1; }
  .arrow.back { color: var(--accent); font-weight: 700; }

  /* --- ascii-style diagrams (trees, graphs, grids) --- */
  pre.art { font-size: 0.9rem; line-height: 1.4; }

  /* --- trace tables --- */
  .tbl { overflow-x: auto; margin: 12px 0 20px; -webkit-overflow-scrolling: touch; }
  table.trace { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.trace th, table.trace td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.trace th { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
  table.trace td code { white-space: nowrap; }
  table.trace tr.hi td { background: var(--accent-soft); }

  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 18px 0; }
  .compare .box { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 16px 18px; }
  .compare .box h4 { margin: 0 0 8px; font-size: 0.95rem; }
  .compare .box ul { margin: 0; padding-left: 18px; font-size: 0.92rem; color: var(--muted); }
  .compare .box li { margin: 4px 0; }
  @media (max-width: 560px) { .compare { grid-template-columns: 1fr; } }

  .steps { counter-reset: step; list-style: none; margin: 0; padding: 0; }
  .steps li { counter-increment: step; position: relative; padding: 4px 0 4px 40px; margin-bottom: 10px; }
  .steps li::before {
    content: counter(step); position: absolute; left: 0; top: 2px;
    width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--ink);
    font-size: 0.85rem; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  .problems { list-style: none; padding: 0; margin: 0; }
  .problems li { display: flex; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .problems .id { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; min-width: 8.5em; }
  .problems .note { color: var(--muted); font-size: 0.9rem; }

  footer { max-width: 760px; margin: 0 auto; padding: 0 24px 64px; color: var(--muted); font-size: 0.9rem; }

  @media (max-width: 600px) {
    header { padding-top: 32px; }
    header h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<header>
  <a class="home" href="../index.html#concepts">← All concepts</a>
  <div class="tag">Concept · Pattern</div>
  <h1>{{TITLE}}</h1>
  <p class="lede">{{LEDE}}</p>
</header>

<main>
{{MAIN}}
</main>

<footer>
  Part of the <a href="../index.html#concepts">DSA concepts</a> collection.
</footer>

</body>
</html>
