[project]
name = "dsa"
version = "0.1.0"
description = "LeetCode practice, organized by difficulty and pattern"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["easy", "medium", "hard"]
python_files = ["test_*.py"]
addopts = "-q"
